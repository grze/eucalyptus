name: Eucalyptus line attribution

on:
  push:
    branches:
      - analysis/eucalyptus-lines-2014-11-20260826
    paths:
      - .github/workflows/eucalyptus-line-attribution.yml
      - analysis/eucalyptus_line_attribution.py
      - analysis/run-attribution.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  november-2014:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout analysis branch
        uses: actions/checkout@v4
        with:
          repository: grze/eucalyptus
          ref: analysis/eucalyptus-lines-2014-11-20260826
          fetch-depth: 0
          path: analysis-repo

      - name: Checkout upstream repository with complete history
        uses: actions/checkout@v4
        with:
          repository: eucalyptus/eucalyptus
          ref: d39e88b05aa8311d59411ea105bca20fd736b254
          fetch-depth: 0
          path: target-repo

      - name: Verify November 2014 snapshot exists
        run: git -C target-repo cat-file -e d39e88b05aa8311d59411ea105bca20fd736b254^{commit}

      - name: Run line-attribution analysis
        run: |
          rm -rf analysis-repo/analysis/results/2014-11
          python3 analysis-repo/analysis/eucalyptus_line_attribution.py \
            --repo target-repo \
            --commit d39e88b05aa8311d59411ea105bca20fd736b254 \
            --out analysis-repo/analysis/results/2014-11 \
            --workers 8

      - name: Commit result tables
        working-directory: analysis-repo
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add analysis/results/2014-11
          git diff --cached --quiet && exit 0
          git commit -m "Add November 2014 Eucalyptus line-attribution results"
          git push origin HEAD:analysis/eucalyptus-lines-2014-11-20260826
